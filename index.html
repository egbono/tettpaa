html,body{margin:0;padding:0}

.abctab-expl .e{display:inline-flex;align-items:center;gap:7px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11.5px;font-weight:600}
.abctab-expl .bb{width:19px;height:19px;border-radius:6px;color:#fff;font-weight:800;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center}
.abcg{margin-bottom:12px}
.abcg-h{display:flex;align-items:center;gap:9px;padding:7px 12px;border-radius:11px 11px 0 0;color:#fff;font-weight:700;font-size:12.5px}
.abcg-h .bb{width:21px;height:21px;border-radius:6px;background:rgba(255,255,255,.25);font-weight:800;font-size:11.5px;display:inline-flex;align-items:center;justify-content:center}
.abcg-h .c{margin-left:auto;background:rgba(255,255,255,.25);border-radius:10px;padding:1px 9px;font-size:10.5px}
.abcg-b{border:2px solid;border-top:none;border-radius:0 0 11px 11px;background:var(--paper);padding:5px 11px}
.abcrow{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.abcrow:last-child{border-bottom:none}
.abcchk{width:20px;height:20px;border:1.5px solid var(--muted-2);border-radius:6px;background:var(--paper);flex:0 0 auto}
.abcrow .n{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.abcsw{display:inline-flex;gap:3px}
.abcsw button{width:20px;height:20px;border-radius:6px;font-size:9.5px;font-weight:800;border:1.5px solid var(--line);color:var(--muted);background:var(--paper);font-family:inherit;display:inline-flex;align-items:center;justify-content:center;padding:0}
.abcsw button.on{color:#fff;border-color:transparent}
.abclsw{display:inline-flex;gap:2px;flex:0 0 auto;margin-left:4px}
.abclsw button{width:20px;height:20px;border-radius:5px;font-size:10px;font-weight:800;border:1.2px solid var(--line);color:var(--muted);background:var(--paper);padding:0;font-family:inherit;display:inline-flex;align-items:center;justify-content:center}
.abclsw button.on{color:#fff;border-color:transparent}
.td-prio{background:var(--paper);border:2px solid var(--petrol);border-radius:12px;padding:10px 12px;margin:0 0 12px}
.td-prio .cap{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--petrol);margin-bottom:8px}
.td-prio .cap>svg{width:14px;height:14px;flex:0 0 auto}
.ncsep{width:1px;height:20px;background:var(--line);margin:0 2px}
.tpprint-ov{position:fixed;inset:0;background:rgba(10,30,36,.5);display:flex;align-items:center;justify-content:center;z-index:260;padding:14px}
.tpprint{background:var(--paper);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);width:min(560px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.tpprint-h{background:var(--petrol);color:#fff;padding:10px 13px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px}

.tpprint-h .x{margin-left:auto;background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:7px;width:26px;height:26px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.tpprint-h .x svg{width:14px;height:14px}
.tpprint-chips{display:flex;gap:5px;padding:9px 11px 0;flex-wrap:wrap}
.tpprint-chips .vchip{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;font-size:10.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}

.tpsheet .bx{width:14px;height:14px;border:1.5px solid #777;border-radius:4px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:9px}

.tpsheet .pdv{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#0a4a4f;display:flex;align-items:center;gap:8px;padding:10px 0 3px}

.td-prio-btns{display:flex;gap:7px;flex-wrap:wrap}
.td-pbtn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:700;font-family:inherit;color:var(--muted)}
.td-pbtn.on{color:#fff}
.td-pbtn .bb{width:19px;height:19px;border-radius:6px;color:#fff;font-weight:800;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center}

select.abcdd{appearance:none;-webkit-appearance:none;font-family:inherit;font-size:13px;font-weight:800;border:none;border-radius:8px;width:27px;height:27px;padding:0;text-align:center;text-align-last:center;line-height:27px;background-image:none;cursor:pointer;color:#fff;flex:0 0 auto;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Sperre mot autoutfylling fra macOS/Safari-kartoteket */
(function(){
  const fixEl=el=>{
    try{
      if(!el||el.nodeType!==1)return;
      if(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA')return;
      const t=(el.getAttribute('type')||'text').toLowerCase();
      if(el.tagName==='INPUT'&&t!=='text'&&t!=='search')return;
      el.setAttribute('autocomplete','anti-autofill-'+Math.floor(Math.random()*1e6));
      el.setAttribute('autocorrect','off');
      el.setAttribute('autocapitalize','off');
      el.setAttribute('spellcheck','false');
      el.setAttribute('data-lpignore','true');
      el.setAttribute('data-1p-ignore','true');
      if(!el.getAttribute('name'))el.setAttribute('name','f'+Math.floor(Math.random()*1e9));
    }catch(_e){}
  };
  const scan=root=>{try{if(root.querySelectorAll)root.querySelectorAll('input,textarea').forEach(fixEl);fixEl(root);}catch(_e){}};
  scan(document);
  try{
    new MutationObserver(ms=>{ms.forEach(m=>{if(m.addedNodes)m.addedNodes.forEach(n=>{if(n.nodeType===1)scan(n);});});}).observe(document.documentElement,{childList:true,subtree:true});
  }catch(_e){}
  document.addEventListener('focusin',e=>fixEl(e.target),true);
})();

function svg(n){return `<svg viewBox="0 0 24 24">${I[n]||''}</svg>`;}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- LAGRING: IndexedDB -> localStorage -> minne ---------- */
const DB_KEY='tettpa-todo-iphone';
let db={todos:[],todoDeleted:[],meta:{}};
let storeMode='minne', idb=null;
function openIdb(){
  return new Promise(res=>{
    if(!('indexedDB' in window))return res(null);
    let req;
    try{req=indexedDB.open(DB_KEY,1);}catch(e){return res(null);}
    req.onupgradeneeded=()=>{try{req.result.createObjectStore('kv');}catch(e){}};
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>res(null);
    setTimeout(()=>res(null),2500);
  });
}
function idbGet(){
  return new Promise(res=>{
    if(!idb)return res(null);
    try{const r=idb.transaction('kv','readonly').objectStore('kv').get('state');
      r.onsuccess=()=>res(r.result||null);r.onerror=()=>res(null);}catch(e){res(null);}
  });
}
function idbPut(v){
  return new Promise(res=>{
    if(!idb)return res(false);
    try{const r=idb.transaction('kv','readwrite').objectStore('kv').put(v,'state');
      r.onsuccess=()=>res(true);r.onerror=()=>res(false);}catch(e){res(false);}
  });
}
async function load(){
  idb=await openIdb();
  if(idb){const v=await idbGet();if(v){db=Object.assign(db,v);}storeMode='idb';return;}
  try{const raw=localStorage.getItem(DB_KEY);if(raw)db=Object.assign(db,JSON.parse(raw));
    localStorage.setItem(DB_KEY+'-probe','1');localStorage.removeItem(DB_KEY+'-probe');
    storeMode='local';return;}catch(e){}
  storeMode='minne';
}
function save(){
  if(!Array.isArray(db.todos))db.todos=[];
  if(!Array.isArray(db.todoDeleted))db.todoDeleted=[];
  if(storeMode==='idb'){idbPut(db);return;}
  if(storeMode==='local'){try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){storeMode='minne';renderWarn();}return;}
}
function renderWarn(){
  const el=document.getElementById('warnbar');
  if(storeMode==='minne'){
    el.className='warnbar';
    el.innerHTML=`${svg('warn')}<div><b>Ingen lagring tilgjengelig.</b> Data forsvinner når du lukker fanen. Eksporter synkfilen før du går ut — eller legg appen på en nettadresse.</div>`;
  }else el.innerHTML='';
}

/* ---------- SYNK (identisk logikk som TettPå 2.0) ---------- */
const TODO_SYNC_APP='TettPaa-ToDo', TODO_SYNC_VER=1, TODO_TOMB_MS=90*864e5, TODO_SOURCE='iPhone';
function todoSyncStamp(d){const p=n=>String(n).padStart(2,'0');d=d||new Date();return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());}
function todoSyncFilename(withImages){return 'TettPaa-fra-iphone-til-mac-versjon'+BUILD_NO+'-'+todoSyncStamp()+(withImages?'-med-bilder':'-uten-bilder')+'.json';}
function todoSyncWhen(ts){if(!ts)return '';const d=new Date(ts);if(isNaN(d))return '';return d.toLocaleDateString('nb-NO',{day:'numeric',month:'long'})+' kl. '+d.toTimeString().slice(0,5);}
function todoMergeData(localTodos,localDel,inTodos,inDel){
  const now=Date.now();
  const delMap={};
  [].concat(localDel||[],inDel||[]).forEach(d=>{if(d&&d.id){const at=d.deletedAt||0;if(!delMap[d.id]||at>delMap[d.id])delMap[d.id]=at;}});
  const map={};
  (localTodos||[]).forEach(t=>{if(t&&t.id)map[t.id]=t;});
  let added=0,updated=0,removed=0,unchanged=0;
  (inTodos||[]).forEach(t=>{
    if(!t||!t.id)return;
    const cur=map[t.id];
    if(!cur){map[t.id]=t;added++;return;}
    if((t.updated||0)>(cur.updated||0)){
      const o=Object.assign({},t);
      if(!('image' in t)&&cur.image)o.image=cur.image;
      map[t.id]=o;updated++;
    }else unchanged++;
  });
  Object.keys(delMap).forEach(id=>{
    const t=map[id];
    if(t&&(t.updated||0)<=delMap[id]){delete map[id];removed++;}
  });
  const deleted=Object.keys(delMap)
    .filter(id=>(now-delMap[id])<TODO_TOMB_MS&&!map[id])
    .map(id=>({id,deletedAt:delMap[id]}));

function tlvBodyHtml(){

    +(t.goal?`<span class="tlv-mal">Mål: ${esc(tlvDato(t.goal))}</span>`:'')

  const brad=tlvBtnRadHtml(true);

  const td=tlvToday();

  cards.forEach(c=>{const st=tlvStatus(c);if(st==='done')fdg.push(c);else if(st==='late')sen.push(c);else if(!c.due)uten.push(c);else rest.push(c);});
  const byd=a=>a.sort((x,y)=>(x.due<y.due?-1:x.due>y.due?1:((x.created||0)-(y.created||0))));

function tlvMerge(inn,innDel){
  const dm={};
  tlvDeleted().forEach(x=>{if(x&&x.id)dm[x.id]=Math.max(dm[x.id]||0,x.deletedAt||0);});
  (Array.isArray(innDel)?innDel:[]).forEach(x=>{if(x&&x.id)dm[x.id]=Math.max(dm[x.id]||0,x.deletedAt||0);});
  if(Array.isArray(inn)){
    const loc=tlvList();
    const kart={};loc.forEach(t=>{if(t&&t.id)kart[t.id]=t;});
    inn.forEach(it=>{
      if(!it||!it.id)return;
      const ex=kart[it.id];
      if(!ex){
        if(dm[it.id]&&(it.updated||it.created||0)<=dm[it.id])return;
        const ny=Object.assign({},it);
        ny.cards=(it.cards||[]).filter(c=>c&&c.id&&!(dm[c.id]&&(c.updated||c.created||0)<=dm[c.id])).map(c=>Object.assign({},c));
        loc.push(ny);kart[ny.id]=ny;return;
      }
      if((it.updated||it.created||0)>(ex.updated||ex.created||0)){
        ex.name=it.name;ex.color=it.color;ex.goal=it.goal;ex.updated=it.updated||Date.now();
      }
      if(!Array.isArray(ex.cards))ex.cards=[];
      const ck={};ex.cards.forEach(c=>{if(c&&c.id)ck[c.id]=c;});
      (it.cards||[]).forEach(c=>{
        if(!c||!c.id)return;
        const e2=ck[c.id];
        if(!e2){
          if(dm[c.id]&&(c.updated||c.created||0)<=dm[c.id])return;
          const n2=Object.assign({},c);ex.cards.push(n2);ck[c.id]=n2;return;
        }
        if((c.updated||c.created||0)>(e2.updated||e2.created||0))Object.assign(e2,c);
      });
    });
  }
  const ider=Object.keys(dm);
  if(ider.length){
    db.timelines=tlvList().filter(t=>!(dm[t.id]&&(t.updated||t.created||0)<=dm[t.id]));
    db.timelines.forEach(t=>{t.cards=(t.cards||[]).filter(c=>!(c&&c.id&&dm[c.id]&&(c.updated||c.created||0)<=dm[c.id]));});
  }
  const na=Date.now();
  db.tlxDeleted=Object.keys(dm).filter(id=>(na-dm[id])<TODO_TOMB_MS).map(id=>({id:id,deletedAt:dm[id]}));
}

function abcSortWithDividers(silent){
  const cs=abcCatsAlpha();
  const order=new Map(cs.map((c,i)=>[c[0],i]));
  const divs=todoDividers();
  const autoLabels=new Set(cs.map(c=>c[0]+' – '+c[1]));
  const seq=[...db.todos.map(t=>({k:'t',o:(t.ord==null?1e9:t.ord),cr:t.created||0,t})),
             ...divs.map(d=>({k:'d',o:(d.ord==null?1e9:d.ord),cr:d.mtime||0,d}))]
    .sort((a,b)=>(a.o-b.o)||(a.cr-b.cr));
  const rmIds=new Set();const anchors=[];const oldPos=new Map();
  const items=[];
  let prev=null,p=0;
  seq.forEach(it=>{
    if(it.k==='t'){items.push(it);prev='t:'+it.t.id;oldPos.set(it.t.id,p++);return;}
    if(autoLabels.has(it.d.label||'')){rmIds.add(it.d.id);prev='a:'+(it.d.label||'').split(' – ')[0];return;}
    if(it.d.abc&&order.has(it.d.abc)){items.push(it);prev='d:'+it.d.id;oldPos.set(it.d.id,p++);return;}
    anchors.push({d:it.d,after:prev});
  });
  const itKey=it=>it.k==='t'?prioMeta(it.t.prio||cs[0][0])[0]:it.d.abc;
  const itId=it=>it.k==='t'?it.t.id:it.d.id;
  const sorted=items.slice().sort((a,b)=>{
    const d=(order.get(itKey(a))||0)-(order.get(itKey(b))||0);if(d)return d;
    return (oldPos.get(itId(a))||0)-(oldPos.get(itId(b))||0);
  });
  const buildDry=()=>{
    const dry=[];const pl=new Set();
    anchors.forEach(a=>{if(!a.after){dry.push('d:'+a.d.id);pl.add(a.d.id);}});
    let dc=null;
    sorted.forEach(it=>{
      const k=itKey(it);
      const key=(it.k==='t'?'t:':'d:')+itId(it);
      if(k!==dc){dc=k;dry.push('a:'+k);anchors.forEach(a=>{if(a.after==='a:'+k&&!pl.has(a.d.id)){dry.push('d:'+a.d.id);pl.add(a.d.id);}});}
      dry.push(key);
      anchors.forEach(a=>{if(a.after===key&&!pl.has(a.d.id)){dry.push('d:'+a.d.id);pl.add(a.d.id);}});
    });
    anchors.forEach(a=>{if(!pl.has(a.d.id))dry.push('d:'+a.d.id);});
    return dry.join('|');
  };
  if(silent){
    const curSig=seq.map(it=>it.k==='t'?('t:'+it.t.id):(autoLabels.has(it.d.label||'')?('a:'+(it.d.label||'').split(' – ')[0]):('d:'+it.d.id))).join('|');
    if(curSig===buildDry())return;
  }
  db.todoDividers=divs.filter(d=>!rmIds.has(d.id));
  let n=0;const now=Date.now();
  const placed=new Set();
  const placeAfter=key=>{anchors.forEach(a=>{if(a.after===key&&!placed.has(a.d.id)){a.d.ord=n++;a.d.mtime=now;placed.add(a.d.id);}});};
  anchors.forEach(a=>{if(!a.after){a.d.ord=n++;a.d.mtime=now;placed.add(a.d.id);}});
  let cur=null;
  sorted.forEach(it=>{
    const k=itKey(it);
    if(k!==cur){cur=k;const m=cs.find(c=>c[0]===k)||cs[0];
      db.todoDividers.push({id:uid(),label:m[0]+' – '+m[1],ord:n++,tile:'kol',num:null,mtime:now});
      placeAfter('a:'+k);}
    if(it.k==='t'){it.t.ord=n++;it.t.updated=now;placeAfter('t:'+it.t.id);}
    else{it.d.ord=n++;it.d.mtime=now;placeAfter('d:'+it.d.id);}
  });
  anchors.forEach(a=>{if(!placed.has(a.d.id)){a.d.ord=n++;a.d.mtime=now;placed.add(a.d.id);}});
  db.meta.sort='egen';
  save();if(!silent)toast('Sortert A-B-C');
}

function greetWord(){const h=new Date().getHours();return h<12?'God morgen':(h<18?'God ettermiddag':'God kveld');}
function clockHm(){const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getHours())+':'+p(d.getMinutes());}
function clockDate(){return new Date().toLocaleDateString('nb-NO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function startClock(){
  if(clockT)clearInterval(clockT);
  clockT=setInterval(()=>{
    const hm=document.getElementById('clkHm');if(hm)hm.textContent=clockHm();
    const g=document.getElementById('greetTxt');if(g)g.textContent=greetWord()+(db.meta.name?', '+db.meta.name:'');
  },15000);
}

  sheetOpen('Ditt navn',`

  `,`<button class="btn ghost" id="nmCancel">Avbryt</button><button class="btn pri" id="nmSave">${svg('check')}<span>Lagre</span></button>`);

  document.getElementById('nmSave').onclick=()=>{
    db.meta.name=document.getElementById('nmInput').value.trim();

  };
}
let catSheetView='list', catSheetColor='#c0413b', catSheetEdit=null;
function openCatSheet(){catSheetView='list';catSheetColor=TODO_CAT_COLORS[0];renderCatSheet();}

  return `<div class="catrow" data-id="${k}">

}

function catRenameKey(ok,nk){
  const now=Date.now();
  (db.todos||[]).forEach(t=>{if((t.abc||'')===ok){t.abc=nk;t.updated=now;}});
  if(Array.isArray(db.meta.board))db.meta.board=db.meta.board.map(x=>x===ok?nk:x);
  if(Array.isArray(db.meta.todoHomeCats))db.meta.todoHomeCats=db.meta.todoHomeCats.map(x=>x===ok?nk:x);
  if((db.meta.todoKolCat||'')===ok)db.meta.todoKolCat=nk;
}
function catAddFromSheet(){
  const name=(document.getElementById('catName').value||'').trim();
  if(!name){toast('Skriv et navn på kategorien.');return;}
  let id=(document.getElementById('catLetter').value||'').trim().toUpperCase();
  if(id){
    if(!/^[A-ZÆØÅ0-9]$/.test(id)){toast('Bokstaven må være én bokstav (A–Å) eller ett tall.');return;}
    if(cats().some(c=>c[0]===id)){toast('Bokstaven '+id+' er allerede i bruk.');return;}
  }else id=nextCatId(name);
  cats().push([id,name,catSheetColor,Date.now()]);
  save();render();renderCatSheet();toast('Kategori lagt til: '+id+' – '+name);
}

function abcAddFromSheet(){
  const name=(document.getElementById('abcName').value||'').trim();
  if(!name){toast('Skriv et navn på valget.');return;}
  let letter=(document.getElementById('abcLetter').value||'').trim().toUpperCase();
  if(letter){
    if(!/^[A-ZÆØÅ0-9]$/.test(letter)){toast('Bokstaven må være én bokstav (A–Å) eller ett tall.');return;}
    if(abcCats().some(c=>c[0]===letter)){toast('Bokstaven '+letter+' er allerede i bruk.');return;}
  }else letter=abcNextCatId(name);
  abcCats().push([letter,name,abcSheetColor,Date.now()]);
  save();render();renderAbcSheet();toast('A-B-C-valg lagt til: '+letter+' – '+name);
}
function wireAbcSheetDrag(list){
  list.querySelectorAll('.grip').forEach(grip=>{
    grip.style.touchAction='none';
    grip.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();});
    grip.addEventListener('pointerdown',e=>{
      if(e.button!=null&&e.button>0)return;
      e.preventDefault();e.stopPropagation();
      const dragEl=grip.closest('.catrow');if(!dragEl)return;
      dragEl.classList.add('dragging');document.body.classList.add('dragging-active');
      const move=ev=>{
        const rows=[...list.querySelectorAll('.catrow:not(.dragging)')];
        const y=ev.clientY;let ref=null;
        for(const r of rows){const bb=r.getBoundingClientRect();if(y<bb.top+bb.height/2){ref=r;break;}}
        if(ref)list.insertBefore(dragEl,ref);else list.appendChild(dragEl);
      };
      const up=()=>{
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        document.removeEventListener('pointercancel',up);
        document.body.classList.remove('dragging-active');
        dragEl.classList.remove('dragging');
        const ids=[...list.querySelectorAll('.catrow')].map(r=>r.dataset.id);
        db.abcCats=ids.map(id=>abcCats().find(c=>c[0]===id)).filter(Boolean);
        save();render();renderAbcSheet();
      };
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
      document.addEventListener('pointercancel',up);
    });
  });
}

function tagAddFromSheet(){

  todoTags().push([id,name,tagSheetIcon,tagSheetColor,false,Date.now()]);
  save();render();renderTagSheet();toast('Når-valg lagt til');
}
function wireTagSheetDrag(list){
  list.querySelectorAll('.grip').forEach(grip=>{
    grip.style.touchAction='none';
    grip.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();});
    grip.addEventListener('pointerdown',e=>{
      if(e.button!=null&&e.button>0)return;
      e.preventDefault();e.stopPropagation();
      const dragEl=grip.closest('.catrow');if(!dragEl)return;
      dragEl.classList.add('dragging');document.body.classList.add('dragging-active');
      const move=ev=>{
        const rows=[...list.querySelectorAll('.catrow:not(.dragging)')];
        const y=ev.clientY;let ref=null;
        for(const r of rows){const bb=r.getBoundingClientRect();if(y<bb.top+bb.height/2){ref=r;break;}}
        if(ref)list.insertBefore(dragEl,ref);else list.appendChild(dragEl);
      };
      const up=()=>{
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        document.removeEventListener('pointercancel',up);
        document.body.classList.remove('dragging-active');
        dragEl.classList.remove('dragging');
        const ids=[...list.querySelectorAll('.catrow')].map(r=>r.dataset.id);
        db.todoTags=ids.map(id=>todoTags().find(t=>t[0]===id)).filter(Boolean);
        save();render();renderTagSheet();
      };
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
      document.addEventListener('pointercancel',up);
    });
  });
}

function wireDrag(container,mode){
  const anchorSel=mode==='cat'?'.card:not(.dragging),.grp,.catempty':'.card:not(.dragging)';
  container.querySelectorAll('.grip').forEach(grip=>{
    grip.style.touchAction='none';
    grip.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();});
    grip.addEventListener('pointerdown',e=>{
      if(e.button!=null&&e.button>0)return;
      e.preventDefault();e.stopPropagation();
      const dragEl=grip.closest('.card');if(!dragEl)return;
      dragEl.classList.add('dragging');
      document.body.classList.add('dragging-active');
      const move=ev=>{
        const anchors=[...container.querySelectorAll(anchorSel)].filter(a=>a!==dragEl);
        const y=ev.clientY;let ref=null;
        for(const a of anchors){const r=a.getBoundingClientRect();if(y<r.top+r.height/2){ref=a;break;}}
        if(ref)container.insertBefore(dragEl,ref);
        else container.appendChild(dragEl);
      };
      const up=()=>{
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        document.removeEventListener('pointercancel',up);
        document.body.classList.remove('dragging-active');
        dragEl.classList.remove('dragging');
        if(mode==='cat')commitCatOrder(container);else commitOrder(container);
      };
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
      document.addEventListener('pointercancel',up);
    });
  });
}
function commitCatOrder(container){
  let curCat=null,n=0;
  [...container.children].forEach(el=>{
    if(!el.classList)return;
    if(el.classList.contains('grp'))curCat=el.dataset.cat;
    else if(el.classList.contains('card')){
      const t=db.todos.find(x=>x.id===el.dataset.id);
      if(t){if(curCat&&t.abc!==curCat)t.abc=curCat;t.ord=n++;t.updated=Date.now();}
    }
  });
  db.todos.forEach(t=>{if(t.ord==null)t.ord=n++;});
  save();render();
}
function commitOrder(container){
  const ids=[...container.querySelectorAll('.card')].map(c=>c.dataset.id);
  let n=0;
  ids.forEach(id=>{const t=db.todos.find(x=>x.id===id);if(t){t.ord=n++;t.updated=Date.now();}});
  db.todos.forEach(t=>{if(t.ord==null)t.ord=n++;});
  save();
}

function commitManual(container){
  const now=Date.now();
  const vis=[];
  [...container.children].forEach(el=>{
    if(!el.classList)return;
    if(el.classList.contains('card')&&el.dataset.id)vis.push('t:'+el.dataset.id);
    else if(el.classList.contains('divrow')&&el.dataset.divid)vis.push('d:'+el.dataset.divid);
  });
  const visSet=new Set(vis);
  const seq=[...db.todos.map(t=>({k:'t',id:t.id,o:(t.ord==null?1e9:t.ord),cr:t.created||0,ref:t})),
             ...todoDividers().map(d=>({k:'d',id:d.id,o:(d.ord==null?1e9:d.ord),cr:d.mtime||0,ref:d}))]
    .sort((a,b)=>(a.o-b.o)||(a.cr-b.cr));
  const byKey=new Map(seq.map(it=>[it.k+':'+it.id,it]));
  let vi=0;
  const newSeq=seq.map(it=>{
    const key=it.k+':'+it.id;
    if(visSet.has(key)){
      while(vi<vis.length&&!byKey.has(vis[vi]))vi++;
      const rep=vi<vis.length?byKey.get(vis[vi++]):it;
      return rep||it;
    }
    return it;
  });
  let n=0;
  newSeq.forEach(it=>{
    if(it.ref.ord!==n){it.ref.ord=n;if(it.k==='t')it.ref.updated=now;else it.ref.mtime=now;}
    n++;
  });
  db.todos.forEach(t=>{if(t.ord==null)t.ord=n++;});
  save();render();
}

function wireBoardDrag(board){
  if(!board)return;

        const kb=col.querySelector('.kbody');if(!kb)return;
        const cards=[...kb.querySelectorAll('.kcard:not(.kdrag)')];

        const em=kb.querySelector('.kempty');if(em)em.remove();

        else{todoSheet(id);}

      document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
    });
  });
}

function wireKolDrag(container){
  container.querySelectorAll('.grip').forEach(grip=>{
    grip.style.touchAction='none';
    grip.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();});
    grip.addEventListener('pointerdown',e=>{
      if(e.button!=null&&e.button>0)return;

        const g=[...container.children].filter(c=>c.dataset&&c.dataset.id&&kolSel.has(c.dataset.id));
        if(g.length)group=g;
      }

      document.body.classList.add('td-dragging-active');
      const move=ev=>{
        const anchors=[...container.children].filter(c=>group.indexOf(c)<0);
        const y=ev.clientY;let ref=null;
        for(const a of anchors){const r=a.getBoundingClientRect();if(y<r.top+r.height/2){ref=a;break;}}
        group.forEach(x=>{if(ref)container.insertBefore(x,ref);else container.appendChild(x);});
      };
      const up=()=>{
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        document.removeEventListener('pointercancel',up);
        document.body.classList.remove('td-dragging-active');
        group.forEach(x=>x.classList.remove('dragging'));

function mcalWireDrag(container){
  container.querySelectorAll('[data-mcgrip]').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      e.preventDefault();
      const row=g.closest('[data-mcid]');if(!row)return;
      const grp=row.classList.contains('mc-mtab')?row.closest('.mc-mgrp'):null;
      const dragEl=grp||row;
      dragEl.classList.add('mc-dragging');if(grp)grp.classList.add('mc-kloss');
      const rows=()=>[...container.querySelectorAll('[data-mcid]')];
      const mv=ev=>{
        let others=rows().filter(x=>x!==row&&!(grp&&grp.contains(x)));
        if(grp)others=others.filter(x=>!x.closest('.mc-mbox'));
        let placed=false;
        for(const o of others){
          const r=o.getBoundingClientRect();
          if(ev.clientY<r.top+r.height/2){const ref=o.classList.contains('mc-mtab')?o.closest('.mc-mgrp'):o;ref.parentNode.insertBefore(dragEl,ref);placed=true;break;}
        }
        if(!placed&&others.length){const last=others[others.length-1];(last.classList.contains('mc-mtab')?last.closest('.mc-mgrp'):last).after(dragEl);}
      };
      const up=()=>{
        document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);
        dragEl.classList.remove('mc-dragging');if(grp)grp.classList.remove('mc-kloss');
        rows().forEach((x,i)=>{const it=mcal().find(y=>y.id===x.dataset.mcid);if(it){it.ord=i;it.updated=Date.now();}});
        save();renderMiniCal();
      };
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    });
  });
}

function shKvittPick(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const mx=1400;let w=img.width,h=img.height;
        if(w>mx||h>mx){const k=Math.min(mx/w,mx/h);w=Math.round(w*k);h=Math.round(h*k);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.82));
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
function shBelopFraTekst(t){
  const s=String(t||'');
  const m=s.match(/\d{1,3}(?:[  .]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?/g)||[];
  let best=0;
  m.forEach(x=>{const n=shPrisNum(x);if(isFinite(n)&&n>best)best=n;});
  return best;
}

function shScanProduct(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=async()=>{
        const mx=480;let w=img.width,h=img.height;
        if(w>mx||h>mx){const k=Math.min(mx/w,mx/h);w=Math.round(w*k);h=Math.round(h*k);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        const small=c.toDataURL('image/jpeg',0.8);
        let navn='',pris=0;
        try{
          if('BarcodeDetector' in window){
            try{
              const det=new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','qr_code']});
              const codes=await det.detect(img);
              if(codes&&codes.length){
                const kode=codes[0].rawValue;
                toast('Strekkode funnet – slår opp navn…');
                try{
                  const resp=await fetch('https://world.openfoodfacts.org/api/v0/product/'+encodeURIComponent(kode)+'.json');
                  const j=await resp.json();
                  if(j&&j.status===1&&j.product)navn=(j.product.product_name_nb||j.product.product_name||'').trim();
                }catch(_e){}
                if(!navn)navn='Vare '+kode;
              }else{toast('Fant ingen strekkode – bildet legges ved.');}
            }catch(_e){}
          }else{
            toast('Strekkodeskanning støttes ikke i denne nettleseren – bildet legges ved.');
          }
          if('TextDetector' in window){
            try{
              const td=new window.TextDetector();
              const txts=await td.detect(img);
              const all=(txts||[]).map(t2=>t2.rawValue||'').join(' ');
              const m2=all.match(/(\d{1,5})[.,]?(\d{0,2})\s*(?:kr|,-|NOK)/i)||all.match(/(\d{2,5})[.,](\d{2})/);
              if(m2)pris=Number(m2[1]+(m2[2]?'.'+m2[2]:''))||0;
            }catch(_e){}
          }
        }catch(_e){}
        cb({img:small,navn,pris});
      };
      img.src=r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
}
function shPrisNum(v){return Number(String(v==null?'':v).replace(/[^0-9,.-]/g,'').replace(/\s/g,'').replace(',','.'))||0;}
function shPrisFmtInput(el){
  if(!el)return;
  const fmt=()=>{
    const raw=String(el.value||'');
    const neg=/^-/.test(raw);
    const parts=raw.split(/[.,]/);
    const int=(parts[0]||'').replace(/[^0-9]/g,'');
    const hasDec=parts.length>1;
    const dec=hasDec?(parts[1]||'').replace(/[^0-9]/g,'').slice(0,2):'';
    let out=int?Number(int).toLocaleString('nb-NO'):'';
    if(hasDec)out+=','+dec;
    el.value=(neg&&out?'-':'')+out;
  };
  el.addEventListener('input',fmt);
  fmt();
}
function mcNrOrder(items){
  if(!items||!items.some(x=>x&&x.div&&!x.plain&&x.nr!=null&&x.nr!==''))return items;
  const pre=[];const blocks=[];let cur=null;
  items.forEach(x=>{
    if(x.div){cur={d:x,rows:[]};blocks.push(cur);}
    else if(cur)cur.rows.push(x);
    else pre.push(x);
  });
  const hasNr=b=>b.d.nr!=null&&b.d.nr!==''&&!isNaN(Number(b.d.nr));
  const num=blocks.filter(hasNr).sort((a,b)=>Number(a.d.nr)-Number(b.d.nr));
  const rest=blocks.filter(b=>!hasNr(b));
  const out=pre.slice();
  num.concat(rest).forEach(b=>{out.push(b.d);out.push(...b.rows);});
  return out;
}

function shopWireDrag(c){
  c.querySelectorAll('[data-shgrip]').forEach(g=>{
    g.addEventListener('pointerdown',e=>{
      if(e.button!=null&&e.button>0)return;
      e.preventDefault();e.stopPropagation();
      const row=g.closest('[data-mcid]');if(!row)return;
      const grp=row.classList.contains('mc-mtab')?row.closest('.mc-mgrp'):null;
      const startY=e.clientY;let dragging=false;
      try{g.setPointerCapture(e.pointerId);}catch(_){}
      const rows=()=>[...c.querySelectorAll('[data-mcid]')];
      const blank=()=>c.querySelectorAll('.mc-mbox.shdrop').forEach(b=>b.classList.remove('shdrop'));
      const merk=()=>{blank();const gb=row.closest('.mc-mgrp[data-shkat]');if(gb){const bx=gb.querySelector('.mc-mbox');if(bx)bx.classList.add('shdrop');}};
      const mv=ev=>{
        if(!dragging){
          if(Math.abs(ev.clientY-startY)<6)return;
          dragging=true;row.classList.add('mc-dragging');document.body.classList.add('sh-dragging-active');
        }
        if(ev.cancelable)ev.preventDefault();
        const others=rows().filter(x=>x!==row&&!(grp&&grp.contains(x)));let placed=false;
        for(const o of others){const r=o.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){const ref=o.classList.contains('mc-mtab')?o.closest('.mc-mgrp'):o;ref.parentNode.insertBefore(grp||row,ref);placed=true;break;}}
        if(!placed&&others.length){const last=others[others.length-1];(last.classList.contains('mc-mtab')?last.closest('.mc-mgrp'):last).after(grp||row);}
        merk();};
      const up=()=>{
        document.removeEventListener('pointermove',mv);
        document.removeEventListener('pointerup',up);
        document.removeEventListener('pointercancel',up);
        try{g.releasePointerCapture(e.pointerId);}catch(_){}
        document.body.classList.remove('sh-dragging-active');
        row.classList.remove('mc-dragging');blank();
        if(!dragging)return;
        const eat=ev2=>{ev2.stopPropagation();ev2.preventDefault();};
        document.addEventListener('click',eat,{once:true,capture:true});
        setTimeout(()=>{document.removeEventListener('click',eat,true);},450);
        const gruppert=(typeof shSortKatPa==='function')&&shSortKatPa();
        rows().forEach((x,i2)=>{const it=shFind(x.dataset.mcid);if(!it)return;
          it.sord=i2;
          if(gruppert&&!it.div){const gb=x.closest('.mc-mgrp[data-shkat]');if(gb)it.skat=gb.getAttribute('data-shkat')||'';}
          it.updated=Date.now();});
        save();renderMiniCal();};
      document.addEventListener('pointermove',mv);
      document.addEventListener('pointerup',up);
      document.addEventListener('pointercancel',up);
    });
  });
}

    if(dg)return dagItems(d).filter(a=>!a.div).length;
    return mcal().filter(a=>!a.div&&!a.dg&&!a.kj&&(a.date||'')===d).length;
  }catch(e){return 0;}
}
function ukAnchor(dg){
  const i=ukIdag();
  if(dg)return (typeof dagAnchor!=='undefined'&&dagAnchor)?dagAnchor:i;
  return (typeof mcalAnchor!=='undefined'&&mcalAnchor)?mcalAnchor:i;
}
function ukStripeHtml(anchor,dg){
  ukWire();
  const a=anchor||ukIdag(),s=ukStart(a),idag=ukIdag();
  let h='';
  for(let i=0;i<7;i++){
    const d=ukAdd(s,i),n=ukTell(d,dg);
    h+=`<button type="button" class="uk-d${d===a?' valgt':''}${d===idag?' idag':''}" data-ukday="${d}" data-ukdg="${dg?1:0}" title="${esc(d)}${n?(' · '+n+' avtale'+(n===1?'':'r')):''}"><i>${UKWD[i]}</i><b>${Number(d.slice(8,10))}</b><span class="uk-pr${n?'':' av'}"></span></button>`;
  }
  return `<div class="uk-stripe">${h}</div>`;
}
function ukKalHtml(anchor,dg){
  const a=anchor||ukIdag(),idag=ukIdag();
  const vm=db.meta.ukMnd||a.slice(0,7);
  const y=Number(vm.slice(0,4)),m=Number(vm.slice(5,7))-1;
  const start=(new Date(y,m,1).getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();
  const forr=new Date(y,m,0).getDate();
  const celler=[];
  for(let i=start-1;i>=0;i--)celler.push({d:forr-i,ut:-1});
  for(let d=1;d<=dim;d++)celler.push({d,ut:0});
  let k=1;while(celler.length%7){celler.push({d:k,ut:1});k++;}
  const rows=celler.map(c=>{
    const dd=ukFmt(new Date(y,m+c.ut,c.d));
    const n=ukTell(dd,dg);
    return `<button type="button" class="uk-c${c.ut?' ut':''}${dd===a?' valgt':''}${dd===idag?' idag':''}" data-ukday="${dd}" data-ukdg="${dg?1:0}">${c.d}${n?`<span class="uk-n">${n}</span><span class="uk-pr"></span>`:''}</button>`;
  }).join('');
  const cn=(typeof cntTell==='function')?cntTell():0;
  return `<div class="uk-kal">
    <div class="uk-kh"><button type="button" class="uk-kb" data-ukmnd="prev" title="Forrige måned">‹</button><b>${UKMND[m]} ${y}</b><button type="button" class="uk-kb" data-ukmnd="next" title="Neste måned">›</button></div>
    <div class="uk-wd">${UKWD.map(w=>`<i>${w}</i>`).join('')}</div>
    <div class="uk-grid">${rows}</div>
    <div class="uk-kf"><button type="button" class="uk-kfb pri" data-ukday="${idag}" data-ukdg="${dg?1:0}">I dag</button>${cn?`<button type="button" class="uk-kfb" data-ukcont>${svg('inbox')}<span>Uten dato · ${cn}</span></button>`:''}</div>
  </div>`;
}
function ukKalPanelHtml(anchor,dg){
  if(!db.meta.ukKalOpen)return '';
  return `<div class="op-frame uk-kalw">${ukKalHtml(anchor,dg)}</div>`;
}
function ukRedraw(){
  if(ukErMobil()){renderMiniCal();return;}
  if(typeof getTodoView==='function'&&getTodoView()==='dagens'){if(typeof dagDraw==='function')dagDraw();return;}
  if(typeof mcalDraw==='function')mcalDraw();
}
function ukSettDag(d,dg){
  if(!d)return;
  db.meta.ukMnd=d.slice(0,7);
  if(dg){if(typeof dagAnchor!=='undefined')dagAnchor=d;}
  else{if(typeof mcalAnchor!=='undefined')mcalAnchor=d;}
  save();ukRedraw();
}
function ukWire(){
  if(window.__ukWired)return;window.__ukWired=true;
  document.addEventListener('click',e=>{
    const t=e.target;if(!t||!t.closest)return;
    const b=t.closest('[data-ukday],[data-ukmnd],[data-ukkal],[data-ukcont]');
    if(!b)return;
    if(b.hasAttribute('data-ukcont')){e.preventDefault();if(typeof cntGaaTil==='function')cntGaaTil();return;}
    if(b.hasAttribute('data-ukkal')){
      e.preventDefault();
      const dg=b.getAttribute('data-ukkal')==='1';
      db.meta.ukKalOpen=!db.meta.ukKalOpen;
      if(db.meta.ukKalOpen)db.meta.ukMnd=(ukAnchor(dg)||ukIdag()).slice(0,7);
      save();ukRedraw();return;
    }
    if(b.hasAttribute('data-ukmnd')){
      e.preventDefault();
      const vm=db.meta.ukMnd||ukIdag().slice(0,7);
      const y=Number(vm.slice(0,4)),m=Number(vm.slice(5,7))-1;
      const d2=new Date(y,m+(b.getAttribute('data-ukmnd')==='next'?1:-1),1);
      db.meta.ukMnd=ukFmt(d2).slice(0,7);save();ukRedraw();return;
    }
    e.preventDefault();
    ukSettDag(b.getAttribute('data-ukday'),b.getAttribute('data-ukdg')==='1');
  });
}


/* ===== XL – regneark med antall, beløp og sum (v511/267) ===== */
function xlErMobil(){return typeof renderMiniCal==='function';}
function xlLists(){if(!Array.isArray(db.xlLists))db.xlLists=[];return db.xlLists;}
function xlAllItems(){if(!Array.isArray(db.xlItems))db.xlItems=[];return db.xlItems;}
function xlKats(){if(!Array.isArray(db.xlKats))db.xlKats=[];return db.xlKats;}
function xlKatOf(id){return xlKats().find(k=>k.id===id)||null;}
function xlSelId(){const ls=xlLists();if(!ls.length)return '';let s=db.meta.xlSel;if(!ls.some(l=>l.id===s)){s=ls[0].id;db.meta.xlSel=s;}return s;}
const xlOrd=(a,b)=>((a.xord==null?1e9:a.xord)-(b.xord==null?1e9:b.xord))||((a.created||0)-(b.created||0));
function xlItems(lid){return xlAllItems().filter(x=>x.lid===lid).sort(xlOrd);}
function xlFind(id){return xlAllItems().find(x=>x.id===id);}
function xlNormalize(lid){xlItems(lid).forEach((x,i)=>{x.xord=i;});}
function xlTall(v){const s=String(v==null?'':v).replace(/\s/g,'').replace(/,/g,'.');const n=parseFloat(s);return isFinite(n)?n:0;}
function xlAnt(x){const n=xlTall(x.antall);return n>0?n:1;}
function xlLinjeSum(x){return xlAnt(x)*xlTall(x.belop);}
function xlKr(n){n=Number(n)||0;const d=Math.abs(Math.round(n*100)%100)?2:0;return n.toLocaleString('nb-NO',{minimumFractionDigits:d,maximumFractionDigits:2});}
function xlBel(n){n=Number(n)||0;return n.toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2});}
function xlAntVis(x){return xlKr(xlAnt(x));}
function xlCount(lid){const it=xlAllItems().filter(x=>x.lid===lid&&!x.div);
  return {linjer:it.length,antall:it.reduce((s,x)=>s+xlAnt(x),0),sum:it.reduce((s,x)=>s+xlLinjeSum(x),0)};}
function xlItemsView(lid){
  const list=xlItems(lid);
  if(!db.meta.xlSortKat)return list;
  const rows=list.filter(x=>!x.div);const out=[];const used=new Set();
  xlKats().forEach(k=>{const g=rows.filter(r=>(r.xkat||'')===k.id);
    if(g.length){out.push({id:'__xl_'+k.id,div:true,xlAuto:true,label:k.name,color:k.color});out.push(...g);g.forEach(r=>used.add(r.id));}});
  const rest=rows.filter(r=>!used.has(r.id));
  if(rest.length){out.push({id:'__xl_none',div:true,xlAuto:true,label:'Uten kategori',color:'#8a938f'});out.push(...rest);}
  return out;
}
function xlGrupper(items){
  const ut=[];let cur={div:null,rader:[],sum:0};
  (items||[]).forEach(x=>{
    if(x.div){if(cur.div||cur.rader.length)ut.push(cur);cur={div:x,rader:[],sum:0};}
    else{cur.rader.push(x);cur.sum+=xlLinjeSum(x);}
  });
  if(cur.div||cur.rader.length)ut.push(cur);
  return ut;
}
function xlIb(attr,ic,rd){
  const m=xlErMobil();
  return m?`<button type="button" class="ib" ${attr}${rd?' style="color:var(--red)"':''}>${ic}</button>`
          :`<button type="button" class="icon-btn${rd?' danger':''}" ${attr}>${ic}</button>`;
}
const XL_DIMIC='<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>';
function xlRowHtml(x){

    ${mcBtnOn('Kat')?`<button type="button" class="pk-kat" data-xlkat="${x.id}" title="Velg kategori"${k?` style="background:${k.color}22;color:${k.color}"`:''}>${k?`<span class="d" style="background:${k.color}"></span>${esc(k.name)}`:'＋'}</button>`:''}
    <b data-xledit="${x.id}">${esc(x.title||'')}</b>
    <span class="xl-nums" data-xledit="${x.id}"><span class="xl-n a">${xlAntVis(x)}</span><span class="xl-n b">${xlBel(xlTall(x.belop))}</span><span class="xl-n s">${xlKr(xlLinjeSum(x))}</span></span>
    <span class="mc-acts">${mcBtnOn('Dim')?dimB:''}${mcBtnOn('Copy')?xlIb(`data-xlcopy="${x.id}"`,svg('copy')):''}${mcBtnOn('Edit')?xlIb(`data-xledit="${x.id}"`,svg('edit')):''}${mcBtnOn('Del')?xlIb(`data-xldel="${x.id}"`,svg('trash'),true):''}</span>
  </div>`;
}
function xlRowsHtml(items){
  let out='';
  xlGrupper(items).forEach(g=>{
    const d=g.div;
    if(d&&d.xlAuto){
      out+=`<div class="mc-mgrp"><div class="mc-mtab" style="background:${d.color};border-color:${d.color};color:#fff"><span>${esc((d.label||'').toUpperCase())}</span><span class="xl-gsum" style="color:${d.color}">Sum ${xlKr(g.sum)}</span></div><div class="mc-mbox">${g.rader.map(xlRowHtml).join('')}</div></div>`;
    }else if(d&&d.plain){
      out+=`<div class="mc-strek" data-mcid="${d.id}"><span class="mc-grip" data-xlgrip title="Dra for å flytte">${svg('grip')}</span><span class="l"></span><span class="xl-gsum">Sum ${xlKr(g.sum)}</span>${mcBtnOn('DivDel')?xlIb(`data-xldel="${d.id}"`,svg('trash'),true):''}</div>`+g.rader.map(xlRowHtml).join('');
    }else if(d){
      out+=`<div class="mc-mgrp"><div class="mc-mtab" data-mcid="${d.id}"><span class="mc-grip" data-xlgrip title="Dra for å flytte">${svg('grip')}</span><span>${esc(d.label||'')}</span><span class="xl-gsum">Sum ${xlKr(g.sum)}</span><span class="mc-mtx">${mcBtnOn('DivEdit')?xlIb(`data-xldivedit="${d.id}"`,svg('edit')):''}${mcBtnOn('DivDel')?xlIb(`data-xldel="${d.id}"`,svg('trash'),true):''}</span></div><div class="mc-mbox">${g.rader.map(xlRowHtml).join('')}</div></div>`;
    }else{
      out+=g.rader.map(xlRowHtml).join('');
    }
  });
  return out;
}

function xlWireDrag(root){
  const w=root||document.getElementById('xlWrap')||document.getElementById('view');if(!w)return;
  w.querySelectorAll('[data-xlrows]').forEach(c=>{
    c.querySelectorAll('[data-xlgrip]').forEach(g=>{
      g.addEventListener('pointerdown',e=>{
        e.preventDefault();
        const row=g.closest('[data-mcid]');if(!row)return;
        const grp=row.classList.contains('mc-mtab')?row.closest('.mc-mgrp'):null;
        row.classList.add('mc-dragging');
        const rows=()=>[...c.querySelectorAll('[data-mcid]')];
        const mv=ev=>{const others=rows().filter(x=>x!==row&&!(grp&&grp.contains(x)));let placed=false;
          for(const o of others){const r=o.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){const ref=o.classList.contains('mc-mtab')?o.closest('.mc-mgrp'):o;ref.parentNode.insertBefore(grp||row,ref);placed=true;break;}}
          if(!placed&&others.length){const last=others[others.length-1];(last.classList.contains('mc-mtab')?last.closest('.mc-mgrp'):last).after(grp||row);}};
        const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);row.classList.remove('mc-dragging');
          rows().forEach((x,i)=>{const it=xlFind(x.dataset.mcid);if(it){it.xord=i;it.updated=Date.now();}});
          save();xlDraw();};
        document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
      });
    });
  });
}

function xlKatUsage(id){return xlAllItems().filter(x=>!x.div&&(x.xkat||'')===id).length;}
function xlAdminTegn(){if(typeof afterChange==='function'){afterChange();return;}if(typeof render==='function')render();}
function xlFmtInn(v){
  let s=String(v==null?'':v).replace(/[^\d,.\-]/g,'').replace(/\./g,',');
  const i=s.indexOf(',');
  if(i>=0)s=s.slice(0,i+1)+s.slice(i+1).replace(/,/g,'');
  const neg=s.charAt(0)==='-';s=s.replace(/-/g,'');
  const del=s.split(',');
  let h=(del[0]||'').replace(/^0+(?=\d)/,'');
  const hh=h.replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (neg?'-':'')+hh+(del.length>1?(','+del[1]):'');
}
function xlInnVerdi(v){if(v==null||v==='')return '';return xlFmtInn(String(v).replace('.',','));}
function xlWireTall(inp,etter){
  if(!inp)return;
  const fmt=()=>{
    const gml=inp.value;
    const pos=(inp.selectionStart==null)?gml.length:inp.selectionStart;
    const sif=(gml.slice(0,pos).match(/[\d,]/g)||[]).length;
    const ny=xlFmtInn(gml);
    if(ny!==gml){
      inp.value=ny;
      let n=0,p=0;
      if(sif>0){for(p=0;p<ny.length;p++){if(/[\d,]/.test(ny[p])){n++;if(n===sif){p++;break;}}}}
      try{inp.setSelectionRange(p,p);}catch(e){}
    }
    if(etter)etter();
  };
  inp.addEventListener('input',fmt);
  fmt();
}

    row.classList.add('mc-dragging');
    const mv=ev=>{const others=[...c.querySelectorAll('[data-xlkid]')].filter(x=>x!==row);let placed=false;
      for(const o of others){const r=o.getBoundingClientRect();if(ev.clientY<r.top+r.height/2){c.insertBefore(row,o);placed=true;break;}}
      if(!placed&&others.length)others[others.length-1].after(row);};
    const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);row.classList.remove('mc-dragging');

function xlWire(){
  if(window.__xlWired)return;window.__xlWired=true;
  document.addEventListener('change',e=>{const t=e.target;if(t&&t.id==='xlSel'){db.meta.xlSel=t.value;save();xlDraw();}});
  document.addEventListener('click',e=>{
    const t=e.target;if(!t||!t.closest)return;
    if(t.closest('[data-xlnew]')){e.preventDefault();xlNewListPop();return;}
    if(t.closest('[data-xllistmeny]')){e.preventDefault();xlListMeny();return;}
    if(t.closest('[data-xladddiv]')){e.preventDefault();xlDivPop('');return;}
    if(t.closest('[data-xladd]')){e.preventDefault();xlLinePop('');return;}
    if(t.closest('[data-xlshare]')){e.preventDefault();xlDelArk();return;}
    if(t.closest('[data-xlsortkat]')){e.preventDefault();db.meta.xlSortKat=!db.meta.xlSortKat;save();xlDraw();return;}
    const kk=t.closest('[data-xlkat]');
    if(kk){e.preventDefault();const it=xlFind(kk.dataset.xlkat);if(it)xlKatMenu(kk,it.xkat||'',v=>{it.xkat=v;it.updated=Date.now();save();xlDraw();});return;}
    const dn=t.closest('[data-xldone]');
    if(dn){e.preventDefault();const it=xlFind(dn.dataset.xldone);if(it){it.done=!it.done;it.updated=Date.now();save();xlDraw();}return;}
    const dm=t.closest('[data-xldim]');
    if(dm){e.preventDefault();const it=xlFind(dm.dataset.xldim);if(it){it.dim=!it.dim;it.updated=Date.now();save();xlDraw();}return;}
    const cp=t.closest('[data-xlcopy]');
    if(cp){e.preventDefault();const it=xlFind(cp.dataset.xlcopy);
      if(it&&!it.div){const nb=Object.assign({},it,{id:uid(),title:(it.title||'')+' (kopi)',done:false,created:Date.now(),updated:Date.now(),xord:(it.xord!=null?it.xord:0)+0.5});
        xlAllItems().push(nb);xlNormalize(nb.lid);save();toast('Linje kopiert');xlDraw();}
      return;}
    const de=t.closest('[data-xldivedit]');
    if(de){e.preventDefault();xlDivPop(de.dataset.xldivedit);return;}
    const dl=t.closest('[data-xldel]');
    if(dl){e.preventDefault();xlSlett(dl.dataset.xldel);return;}
    const ed=t.closest('[data-xledit]');
    if(ed){e.preventDefault();xlLinePop(ed.dataset.xledit);return;}
  });
}
xlWire();

function divKartBrukt(navn){try{const n=String(navn||'').toLowerCase();if(!n)return 0;return mcal().filter(a=>a.div&&String(a.label||'').toLowerCase()===n).length;}catch(e){return 0;}}
function mcDivPicker(box,items,sel,onPick,nyFn){
  if(!box)return;
  const grunn=[{id:'',label:'Øverst (ingen skillelinje)',n:0,top:true}].concat(items);
  const lblOf=v=>{const it=grunn.find(x=>x.id===v);return it?it.label:'Øverst (ingen skillelinje)';};
  const nyRader=q=>{
    if(!nyFn)return [];
    const qq=q.trim().toLowerCase();
    const kart=(typeof divKart==='function'?divKart():[]).slice()
      .map(k=>({navn:String(k.name||''),nr:(k.nr==null?'':k.nr),brukt:divKartBrukt(k.name)}))
      .filter(k=>k.navn&&(!qq||k.navn.toLowerCase().indexOf(qq)>=0))
      .sort((a,b)=>(b.brukt-a.brukt)||a.navn.localeCompare(b.navn,'nb'))
      .slice(0,12)
      .map(k=>({id:'__k_'+k.navn,ny:true,kart:true,navn:k.navn,nr:k.nr,brukt:k.brukt,label:k.navn}));
    const hdr={id:'__hdr',hdr:true,label:kart.length?'Ny skillelinje · velg fra kartoteket':'Ny skillelinje'};
    const egen={id:'__egen',ny:true,egen:true,label:q.trim()?('Lag «'+q.trim()+'» …'):'Skriv eget navn …'};
    const strek={id:'__strek',ny:true,strek:true,label:'Kun strek (uten navn)'};
    return [hdr].concat(kart,[egen,strek]);
  };
  const treff=q=>{const qq=q.trim().toLowerCase();const b=qq?grunn.filter(it=>(it.label||'').toLowerCase().indexOf(qq)>=0):grunn;return b.concat(nyRader(q));};
  const mrk=(t,qq)=>{t=t||'';if(!qq)return esc(t);const i=t.toLowerCase().indexOf(qq);if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+qq.length))+'</mark>'+esc(t.slice(i+qq.length));};
  const radHtml=(it,qq)=>{
    if(it.hdr)return `<div class="dvpm-hdr">${svg('plus')}<span>${esc(it.label)}</span></div>`;
    const ic=it.kart?(it.nr!==''&&it.nr!=null?`<span class="dvp-nr">${esc(String(it.nr))}</span>`:`<span class="dvp-kic">${svg('tag')}</span>`)
      :it.egen?`<span class="dvp-kic">${svg('edit')}</span>`
      :it.strek?'<span class="dvp-strek"></span>'
      :it.top?'<span class="dvp-none">⊘</span>'
      :(it.nr?`<span class="dvp-nr">${esc(String(it.nr))}</span>`:'<span class="dvp-dot"></span>');
    const hoyre=it.kart?(it.brukt?`<span class="dvp-brukt">brukt ${it.brukt}</span>`:''):(it.n?`<span class="dvp-n">${it.n}</span>`:'');
    const kl='dvpm-li'+((it.id===sel&&!it.ny)?' valgt':'')+(it.ny?' nyi':'');
    return `<div class="${kl}" data-dvpi="${esc(it.id)}">${ic}<span class="dvp-l">${it.ny&&!it.kart?esc(it.label):mrk(it.label,qq)}</span>${hoyre}</div>`;
  };
  let popState=null;
  const closePop=()=>{if(popState){popState.ov.remove();document.removeEventListener('keydown',popState.onKey);popState=null;}};
  const draw=()=>{
    const tom=!sel;
    box.innerHTML=`<button type="button" class="dvp-fieldbtn${tom?' tom':''}" data-dvpopen>${svg('grip')}<span>${esc(lblOf(sel))}</span><span class="chev">▾</span></button>`;
    const btn=box.querySelector('[data-dvpopen]');if(btn)btn.addEventListener('click',openPop);
  };
  const openPop=()=>{
    closePop();
    let q='';
    const ov=document.createElement('div');ov.className='dvpm-ov';
    ov.innerHTML=`<div class="dvpm">
      <div class="dvpm-h">${svg('grip')}<span>Velg skillelinje</span><button type="button" class="dvpm-x" data-dvpmx title="Lukk">${svg('x')}</button></div>
      <div class="dvpm-search">${svg('search')}<input type="text" placeholder="Søk etter skillelinje…" autocomplete="off"></div>
      <div class="dvpm-list"></div>
      <div class="dvpm-foot"><button type="button" data-dvpmcancel>Avbryt</button></div>
    </div>`;
    document.body.appendChild(ov);
    const inp=ov.querySelector('.dvpm-search input'),lst=ov.querySelector('.dvpm-list');
    const tegn=()=>{
      const qq=q.trim().toLowerCase(),t=treff(q);
      lst.innerHTML=t.length?t.map(it=>radHtml(it,qq)).join(''):`<div class="dvpm-tom">Ingen skillelinje passer med «${esc(q)}»</div>`;
    };
    tegn();
    inp.addEventListener('input',()=>{q=inp.value;tegn();});
    inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'){e.preventDefault();closePop();}});
    const velgRad=li=>{
      const t=treff(q),it=t.find(x=>String(x.id)===li.dataset.dvpi);
      if(!it||it.hdr)return;
      if(it.ny){
        if(it.egen&&!q.trim()){inp.focus();return;}
        const navn=it.kart?it.navn:q.trim();
        const opt=it.kart?{nr:it.nr,kart:true}:(it.strek?{plain:true}:{});
        closePop();nyFn(navn,opt);return;
      }
      sel=it.id;closePop();draw();onPick(it.id);
    };
    let _dvpDrag=false,_dvpStartY=0,_dvpStartScroll=0,_dvpMoved=false,_dvpDownLi=null,_dvpDownT=0;
    lst.addEventListener('pointerdown',e=>{
      _dvpDrag=true;_dvpStartY=e.clientY;_dvpStartScroll=lst.scrollTop;_dvpMoved=false;
      _dvpDownLi=e.target.closest('[data-dvpi]');_dvpDownT=Date.now();
    });
    lst.addEventListener('pointermove',e=>{
      if(!_dvpDrag)return;
      const dy=e.clientY-_dvpStartY;
      if(Math.abs(dy)>6)_dvpMoved=true;
      lst.scrollTop=_dvpStartScroll-dy;
    });
    lst.addEventListener('pointerup',()=>{
      if(!_dvpDrag)return;_dvpDrag=false;
      if(!_dvpMoved&&_dvpDownLi&&Date.now()-_dvpDownT<600)velgRad(_dvpDownLi);
    });
    lst.addEventListener('pointercancel',()=>{_dvpDrag=false;});
    const xBtn=ov.querySelector('[data-dvpmx]');if(xBtn)xBtn.addEventListener('click',closePop);
    const cBtn=ov.querySelector('[data-dvpmcancel]');if(cBtn)cBtn.addEventListener('click',closePop);
    ov.addEventListener('mousedown',e=>{if(e.target===ov)closePop();});
    const onKey=e=>{if(e.key==='Escape')closePop();};
    document.addEventListener('keydown',onKey);
    popState={ov,onKey};
    setTimeout(()=>{try{inp.focus();}catch(e){}},30);
  };
  draw();
}

function abcGroupPop(k){
  const m=abcCats().find(c=>c[0]===k);if(!m)return;
  const cid0=abcCats()[0][0];
  const items=(db.todos||[]).filter(t=>!t.done&&(t.prio||cid0)===k).sort((a,b)=>((a.ord==null?1e9:a.ord)-(b.ord==null?1e9:b.ord))||((a.created||0)-(b.created||0)));
  const old=document.getElementById('abcPopOv');if(old)old.remove();
  const ov=document.createElement('div');ov.id='abcPopOv';ov.className='abcpop-ov';
  ov.innerHTML=`<div class="abcpop"><div class="abcpop-h" style="background:${m[2]}"><span class="bb">${esc(m[0])}</span><span>${esc(m[1])}</span><span class="c">${items.length}</span><button type="button" class="x" data-abcpopx>${svg('close')}</button></div><div class="abcpop-b">${items.length?items.map(t=>`<div class="abcpop-row" data-abcpopopen="${t.id}"><span class="abcchk"></span><span class="n">${esc(t.title||'')}</span></div>`).join(''):`<div class="abcempty" style="padding:10px">Ingen oppgaver her.</div>`}</div></div>`;
  ov.addEventListener('click',e=>{
    if(e.target===ov||e.target.closest('[data-abcpopx]')){ov.remove();return;}
    const r=e.target.closest('[data-abcpopopen]');
    if(r){ov.remove();todoSheet(r.dataset.abcpopopen);}
  });
  document.body.appendChild(ov);
}
function wireAbcTab(v){
  v.querySelectorAll('[data-abcpop]').forEach(b=>b.addEventListener('click',()=>abcGroupPop(b.dataset.abcpop)));
  v.querySelectorAll('[data-abcgtoggle]').forEach(h=>h.addEventListener('click',()=>{
    const k=h.dataset.abcgtoggle;
    const set=new Set(Array.isArray(db.meta.abcClosed)?db.meta.abcClosed:[]);
    set.has(k)?set.delete(k):set.add(k);
    db.meta.abcClosed=[...set];save();render();
  }));
  const all=v.querySelector('[data-abcgall]');
  if(all)all.addEventListener('click',()=>{
    const set=new Set(Array.isArray(db.meta.abcClosed)?db.meta.abcClosed:[]);
    db.meta.abcClosed=set.size?[]:abcCats().map(c=>c[0]);
    save();render();
  });
  v.querySelectorAll('.abcgrip').forEach(grip=>{
    grip.style.touchAction='none';
    grip.addEventListener('click',e=>{e.stopPropagation();e.preventDefault();});
    grip.addEventListener('pointerdown',e=>{
      if(e.button!=null&&e.button>0)return;
      e.preventDefault();e.stopPropagation();
      const dragEl=grip.closest('.abcrow');if(!dragEl)return;
      dragEl.classList.add('dragging');document.body.classList.add('dragging-active');
      const move=ev=>{
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const body=el&&el.closest?el.closest('.abcg-b'):null;
        if(!body)return;
        const rows=[...body.querySelectorAll('.abcrow:not(.dragging)')];
        let ref=null;for(const r of rows){const b=r.getBoundingClientRect();if(ev.clientY<b.top+b.height/2){ref=r;break;}}
        if(ref)body.insertBefore(dragEl,ref);else body.appendChild(dragEl);
      };
      const up=()=>{
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        document.removeEventListener('pointercancel',up);
        document.body.classList.remove('dragging-active');
        dragEl.classList.remove('dragging');
        const body=dragEl.closest('.abcg-b');
        const k=body?body.dataset.cat:null;
        const t=(db.todos||[]).find(x=>x.id===dragEl.dataset.abcid);

          if((t.prio||abcCats()[0][0])!==k)t.prio=k;
          let n=0;const now=Date.now();
          v.querySelectorAll('.abcg-b').forEach(b2=>{
            b2.querySelectorAll('.abcrow').forEach(r=>{
              const tt=(db.todos||[]).find(x=>x.id===r.dataset.abcid);
              if(tt){tt.ord=n++;tt.updated=now;}
            });
          });
          if(getAbcSortOn())abcSortWithDividers(true);
          save();
        }
        render();
      };
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
      document.addEventListener('pointercancel',up);
    });
  });
}
